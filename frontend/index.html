<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/US.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UptoSkills</title>

    <!-- Pre-Connect -->
    <link rel="preconnect" href="http://localhost:5000" />
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Pre-Load -->
    <link rel="preload" href="/US.png" as="image" />
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      as="style"
    />

    <!-- Pre-fetch -->
    <link rel="dns-prefetch" href="https://js.stripe.com" />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link rel="dns-prefetch" href="https://ai-mentor-5b2d2.firebaseapp.com" />
  </head>

  <body>
    <div id="root">
      <style id="app-startup-loader-styles">
        #app-startup-loader {
          position: fixed;
          inset: 0;
          z-index: 99999;
          display: flex;
          align-items: center;
          justify-content: center;
          min-height: 100dvh;
          padding: 24px;
          background: #ffffff;
          color: #0f172a;
          font-family:
            Manrope,
            ui-sans-serif,
            system-ui,
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            sans-serif;
        }
        #app-startup-loader::before {
          content: "";
          position: absolute;
          left: 50%;
          top: 50%;
          width: 520px;
          height: 520px;
          max-width: 90vw;
          max-height: 90vw;
          transform: translate(-50%, -50%);
          border-radius: 999px;
          background: rgba(59, 130, 246, 0.08);
          filter: blur(120px);
          pointer-events: none;
        }
        .app-startup-loader__content {
          position: relative;
          width: min(360px, 88vw);
          text-align: center;
        }
        .app-startup-loader__logo {
          display: block;
          width: min(350px, 86vw);
          height: auto;
          margin: 0 auto;
          object-fit: contain;
        }
        .app-startup-loader__title {
          margin: 28px 0 0;
          font-size: 30px;
          line-height: 1.2;
          font-weight: 700;
          letter-spacing: -0.025em;
        }
        .app-startup-loader__message {
          margin: 10px 0 0;
          color: #64748b;
          font-size: 14px;
          font-weight: 500;
        }
        .app-startup-loader__spinner {
          width: 44px;
          height: 44px;
          margin: 30px auto 0;
          border: 3px solid #dbeafe;
          border-top-color: #3b82f6;
          border-radius: 999px;
          animation: app-startup-spin 0.8s linear infinite;
        }
        @keyframes app-startup-spin {
          to {
            transform: rotate(360deg);
          }
        }
        @media (prefers-color-scheme: dark) {
          #app-startup-loader {
            background: #0b1220;
            color: #ffffff;
          }
          #app-startup-loader::before {
            background: rgba(59, 130, 246, 0.1);
          }
          .app-startup-loader__message {
            color: #94a3b8;
          }
          .app-startup-loader__spinner {
            border-color: #1e3a5f;
            border-top-color: #60a5fa;
          }
        }
        @media (prefers-reduced-motion: reduce) {
          .app-startup-loader__spinner {
            animation: none;
          }
        }
      </style>
      <div
        id="app-startup-loader"
        role="status"
        aria-live="polite"
        aria-label="Loading UptoSkills AI Mentor"
      >
        <div class="app-startup-loader__content">
          <img
            class="app-startup-loader__logo"
            src="/AI_Tutor_New_UI/Signup_login_page/uptoskills-logo.webp"
            alt="UptoSkills"
          />
          <h1 class="app-startup-loader__title">AI Mentor</h1>
          <p class="app-startup-loader__message">Preparing your workspace...</p>
          <div class="app-startup-loader__spinner" aria-hidden="true"></div>
        </div>
      </div>
    </div>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
