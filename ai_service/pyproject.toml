[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Step 1 of the ai_service lint gate (issue #664): pycodestyle errors,
# pyflakes and import order — the rules that catch unused imports, undefined
# names and unsorted imports. Wider rule sets and `ruff format` enforcement
# are step 2.
select = ["E4", "E7", "E9", "F", "I"]
ignore = [
    # Several modules and tests adjust sys.path or the environment before
    # importing; moving those imports to the top is step-2 cleanup, not
    # something an autofix should do.
    "E402",
]
